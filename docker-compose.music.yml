# Opcional: deja que la música suene por los altavoces del host (jack auxiliar o parlante Bluetooth).
# No cambia docker-compose.yml: se activa poniendo en .env
#   COMPOSE_FILE=docker-compose.yml:docker-compose.music.yml
# y después basta con el comando de siempre: docker compose up -d --build
#
# El contenedor no toca la tarjeta de sonido ni el Bluetooth directamente: habla con el servidor de
# sonido del host (PipeWire o PulseAudio) a través de su socket, que se monta aquí. El emparejamiento
# Bluetooth se hace una vez en el host (ver README). Sin puertos publicados.
services:
  api:
    environment:
      PULSE_SERVER: unix:/run/lumia-pulse/native
    volumes:
      - type: bind
        # Socket del usuario del host que tiene la sesión de sonido (UID 1000 por defecto).
        source: ${MUSIC_PULSE_SOCKET:-/run/user/1000/pulse/native}
        target: /run/lumia-pulse/native
        bind:
          # Si el socket no existe (servidor de sonido apagado), falla en vez de crear una carpeta.
          create_host_path: false
