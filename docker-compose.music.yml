# Opcional: publica la API en la LAN para que el ESP32 (Wi-Fi) llegue al stream de música.
# No cambia docker-compose.yml: se activa solo si se combina explícitamente:
#   docker compose -f docker-compose.yml -f docker-compose.music.yml up -d --build
#
# Se publica únicamente en la IP de la LAN indicada (nunca 0.0.0.0). Ojo: el puerto expone toda la
# API a la LAN; el resto de rutas siguen exigiendo X-API-Key y las del ESP32 su propio token.
services:
  api:
    ports:
      - "${MUSIC_DEVICE_BIND_ADDRESS:?define MUSIC_DEVICE_BIND_ADDRESS (IP LAN del host) en .env}:${MUSIC_DEVICE_PORT:-8000}:${API_PORT:-8000}"
